[project]
name = "music-taste-agents"
version = "0.2.0"
description = "Music recommender with Django REST API, Django MVC templates, and React + Tailwind UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.6.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=8.1.1",
    "curl-cffi>=0.15.0",
    "asgiref>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend/recommender", "backend/api", "backend/web", "backend/config"]

[tool.hatch.build.targets.wheel.sources]
"backend" = ""
