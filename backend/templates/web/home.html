{% extends "web/base.html" %}

{% block content %}
<section class="hero">
  <h1>{{ title }}</h1>
  <p>
    Tell it what you like. Two agents check Pitchfork and Rate Your Music, then the
    Django REST API returns similar albums.
  </p>
  <p class="meta">LLM provider: {{ provider }} · model: {{ model }}</p>

  <form id="taste-form" class="form">
    <label>
      What do you like?
      <textarea name="taste" rows="4" required placeholder="e.g. dreamy bedroom pop, soft indie rock"></textarea>
    </label>
    <label>
      Seed artists
      <input name="artists" type="text" placeholder="Bad Bunny, Olivia Rodrigo" />
    </label>
    <div class="row">
      <label>
        How many
        <input name="limit" type="number" min="1" max="9" value="5" required />
      </label>
      <button class="btn" type="submit">Find albums</button>
    </div>
  </form>

  <p id="status" class="status" role="status"></p>
  <div id="results"></div>
</section>
<script src="{% static 'web/recommend.js' %}"></script>
{% endblock %}
